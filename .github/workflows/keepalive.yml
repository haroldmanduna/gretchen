# Pings Gretchen every 10 minutes so the free Render service does not sleep.
# Set a repository variable named APP_URL (GitHub > Settings > Secrets and variables > Actions > Variables),
# for example https://gretchen.onrender.com
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          test -n "${{ vars.APP_URL }}" || { echo "Set the APP_URL variable first"; exit 1; }
          curl -fsS --max-time 60 "${{ vars.APP_URL }}/health"
